buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10")
    }
}

apply plugin: 'application'
apply plugin: 'kotlin'

application {
    mainClass = 'com.zx_tole.lineage2_guide.server.Lineage2ApplicationKt'
}

// Repositories managed globally in settings.gradle.kts

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // Ktor Server
    implementation "io.ktor:ktor-server-core:3.1.3"
    implementation "io.ktor:ktor-server-netty:3.1.3"
    implementation "io.ktor:ktor-server-cors:3.1.3"

    
    // Logging
    implementation "ch.qos.logback:logback-classic:1.5.16"
    
    // Testing
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.2.10"
    testImplementation "io.ktor:ktor-server-test-base:3.1.3"
}

test {
    useJUnitPlatform()
}
